<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Top-Up Terminal</title>

    <!-- Firebase SDKs (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
      // Firebase Configuration matching your main POS app
      const firebaseConfig = {
        apiKey: "AIzaSyA03_nm4Zk3RXmgIxKbxXP-pEGWnzmsQOE",
        authDomain: "pos21-8f88f.firebaseapp.com",
        databaseURL: "https://pos21-8f88f-default-rtdb.firebaseio.com",
        projectId: "pos21-8f88f",
        storageBucket: "pos21-8f88f.firebasestorage.app",
        messagingSenderId: "49870857272",
        appId: "1:49870857272:web:d349580c3d5ebb6f93f2cd"
      };

      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      const db = firebase.database();
    </script>

    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #1d4ed8;
            --success: #22c55e;
            --dark-bg: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --input-bg: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--dark-bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }

        .container { width: 100%; max-width: 480px; }
        .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 30px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); }
        h1 { margin-bottom: 8px; font-size: 1.6rem; text-align: center; }
        p.subtitle { color: var(--text-muted); text-align: center; font-size: 0.9rem; margin-bottom: 25px; }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; color: var(--text-muted); }
        input { width: 100%; padding: 12px 16px; background: var(--input-bg); border: 1px solid var(--card-border); color: var(--text-main); border-radius: 8px; font-size: 1.1rem; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: var(--primary); }

        .quick-amounts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
        .chip { background: var(--input-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 8px; border-radius: 6px; cursor: pointer; text-align: center; font-weight: 600; transition: all 0.2s; }
        .chip:hover { border-color: var(--primary); background: #1e3a8a; }

        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: background-color 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }

        .account-preview { background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 15px; margin-bottom: 20px; display: none; }
        .account-preview .row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.95rem; }
        .account-preview .row:last-child { margin-bottom: 0; }
        .account-preview .val { font-weight: bold; color: var(--primary); }

        #toast { position: fixed; bottom: 25px; right: 25px; padding: 15px 25px; background: #334155; color: white; border-radius: 8px; display: none; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); font-weight: 500; border: 1px solid #475569; z-index: 9999; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: var(--text-muted); text-decoration: none; font-size: 0.85rem; }
        .back-link:hover { color: var(--text-main); }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>💳 Account Top-Up Kiosk</h1>
            <p class="subtitle">Deposit balance directly to customer profiles</p>

            <div class="form-group">
                <label for="topup-id">Customer Account Code (ID)</label>
                <input type="text" id="topup-id" placeholder="e.g. 48192" oninput="lookupAccount()">
            </div>

            <div class="account-preview" id="account-preview">
                <div class="row">
                    <span>Account Holder:</span>
                    <span class="val" id="prev-name">---</span>
                </div>
                <div class="row">
                    <span>Current Balance:</span>
                    <span class="val" id="prev-balance">$0.00</span>
                </div>
            </div>

            <div class="form-group">
                <label>Deposit Amount ($ USD)</label>
                <div class="quick-amounts">
                    <div class="chip" onclick="setAmount(5)">+$5</div>
                    <div class="chip" onclick="setAmount(10)">+$10</div>
                    <div class="chip" onclick="setAmount(20)">+$20</div>
                    <div class="chip" onclick="setAmount(50)">+$50</div>
                </div>
                <input type="number" id="topup-amount" placeholder="0.00" step="0.01">
            </div>

            <button class="btn btn-primary" onclick="submitTopUp()">Complete Electronic Deposit</button>
            <a href="index.html" class="back-link">← Return to Staff POS Terminal</a>
        </div>
    </div>

    <div id="toast">Notification Message</div>

    <script>
        let selectedAccount = null;

        function fireToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3500);
        }

        function setAmount(val) {
            document.getElementById('topup-amount').value = val.toFixed(2);
        }

        function lookupAccount() {
            const code = document.getElementById('topup-id').value.trim();
            const preview = document.getElementById('account-preview');

            if (!code) {
                preview.style.display = 'none';
                selectedAccount = null;
                return;
            }

            db.ref('accounts').child(code).once('value').then(snapshot => {
                if (snapshot.exists()) {
                    selectedAccount = snapshot.val();
                    document.getElementById('prev-name').innerText = selectedAccount.name || `User #${code}`;
                    document.getElementById('prev-balance').innerText = `$${(parseFloat(selectedAccount.balance) || 0).toFixed(2)}`;
                    preview.style.display = 'block';
                } else {
                    preview.style.display = 'none';
                    selectedAccount = null;
                }
            });
        }

        function submitTopUp() {
            const code = document.getElementById('topup-id').value.trim();
            const amountInput = document.getElementById('topup-amount').value.trim();
            const amount = parseFloat(amountInput);

            if (!code) {
                fireToast("❌ Please enter a Customer Account ID.");
                return;
            }

            if (isNaN(amount) || amount <= 0) {
                fireToast("❌ Please enter a deposit amount greater than $0.00.");
                return;
            }

            const accountRef = db.ref('accounts').child(code);

            accountRef.once('value').then(snapshot => {
                if (!snapshot.exists()) {
                    fireToast(`❌ Account #${code} not found in Firebase.`);
                    return;
                }

                const data = snapshot.val();
                const currentBalance = parseFloat(data.balance) || 0;
                const newBalance = currentBalance + amount;
                const accountName = data.name || `User #${code}`;

                return accountRef.update({
                    balance: newBalance,
                    lastTopUp: Date.now()
                }).then(() => {
                    fireToast(`✅ Deposited $${amount.toFixed(2)} to ${accountName}! New Balance: $${newBalance.toFixed(2)}`);
                    document.getElementById('topup-id').value = '';
                    document.getElementById('topup-amount').value = '';
                    document.getElementById('account-preview').style.display = 'none';
                });
            }).catch(err => {
                console.error("Top-Up Error:", err);
                fireToast("❌ Top-up failed: " + err.message);
            });
        }
    </script>
</body>
</html>
