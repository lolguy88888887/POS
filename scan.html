<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Scanner Terminal</title>
    <!-- HTML5 QR Code Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyA03_nm4Zk3RXmgIxKbxXP-pEGWnzmsQOE",
        authDomain: "pos21-8f88f.firebaseapp.com",
        databaseURL: "https://pos21-8f88f-default-rtdb.firebaseio.com",
        projectId: "pos21-8f88f",
        storageBucket: "pos21-8f88f.firebasestorage.app",
        messagingSenderId: "49870857272",
        appId: "1:49870857272:web:d349580c3d5ebb6f93f2cd"
      };

      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      const db = firebase.firestore();
    </script>

    <style>
        :root {
            --primary: #3b82f6;
            --success: #22c55e;
            --danger: #ef4444;
            --dark-bg: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--dark-bg); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; padding: 20px; }

        .app-container { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 20px; }

        .header-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 12px 15px; border-radius: 12px; border: 1px solid var(--card-border); font-size: 0.85rem; }
        
        .page-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 25px 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        .page-title { font-size: 1.1rem; font-weight: 700; color: var(--text-main); margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.5px; }

        .amount-display { font-size: 2.5rem; font-weight: 800; color: var(--primary); margin: 10px 0; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; background: #064e3b; color: #a7f3d0; border: 1px solid #047857; }

        #pos-reader { width: 100%; border-radius: 12px; overflow: hidden; background: black; margin-bottom: 15px; }

        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #334155; color: white; padding: 12px 20px; border-radius: 30px; border: 1px solid #475569; font-weight: bold; display: none; z-index: 10000; box-shadow: 0 8px 16px rgba(0,0,0,0.4); text-align: center; width: 90%; max-width: 350px; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header-bar">
            <span>📷 Dedicated POS Camera Scanner</span>
            <a href="index.html" style="color: var(--danger); text-decoration: none; font-weight: bold;">← Back to POS</a>
        </div>

        <!-- POS-ООС ИРСЭН ТӨЛБӨРИЙН ДҮН -->
        <div class="page-card">
            <div class="page-title">Active POS Checkout Charge</div>
            <div class="amount-display" id="display-due-amount">$0.00</div>
            <div class="status-badge" id="scanner-status-text">⌛ Waiting for POS Invoice...</div>
        </div>

        <!-- КАМЕР УНШИХ ХЭСЭГ -->
        <div class="page-card">
            <div class="page-title">Scan Customer Wallet QR</div>
            <div id="pos-reader"></div>
            <p style="font-size: 0.8rem; color: var(--text-muted);">Show customer's wallet QR code to auto-deduct funds.</p>
        </div>
    </div>

    <div id="toast">Notification</div>

    <script>
        let posScanner = null;
        let activeInvoiceId = null;
        let activeAmount = 0.00;
        let isProcessing = false;

        function fireToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3500);
        }

        // Unшуулахад гарах Beep дуу
        function playBeepSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = "sine";
                oscillator.frequency.setValueAtTime(850, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15);
            } catch (e) { console.log(e); }
        }

        // POS дээр Checkout хийхэд Firestore дээр үүсэх Invoice-ийг сосож чаддаг listener
        db.collection("active_checkouts").doc("current_checkout").onSnapshot((docSnap) => {
            if (docSnap.exists) {
                const data = docSnap.data();
                if (data.status === "PENDING" && data.amount > 0) {
                    activeInvoiceId = data.invoiceId;
                    activeAmount = data.amount;
                    document.getElementById('display-due-amount').innerText = `$${activeAmount.toFixed(2)}`;
                    document.getElementById('scanner-status-text').innerText = "🔊 Ready to Scan Wallet QR";
                    document.getElementById('scanner-status-text').style.background = "#064e3b";
                } else {
                    resetCheckoutState();
                }
            } else {
                resetCheckoutState();
            }
        });

        function resetCheckoutState() {
            activeInvoiceId = null;
            activeAmount = 0.00;
            document.getElementById('display-due-amount').innerText = "$0.00";
            document.getElementById('scanner-status-text').innerText = "⌛ Waiting for POS Invoice...";
            document.getElementById('scanner-status-text').style.background = "#334155";
        }

        // Камер ажиллуулах
        function startScanner() {
            posScanner = new Html5Qrcode("pos-reader");
            posScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 220, height: 220 } },
                async (decodedText) => {
                    if (isProcessing) return;

                    if (!activeInvoiceId || activeAmount <= 0) {
                        fireToast("❌ No active payment pending on POS!");
                        return;
                    }

                    try {
                        const parsed = JSON.parse(decodedText);
                        if (parsed.type === "CUSTOMER_WALLET_PAY" && parsed.accountId) {
                            isProcessing = true;
                            playBeepSound(); // 🔊 BEEP!
                            fireToast(`🔍 Processing Account #${parsed.accountId}...`);

                            await chargeCustomerAccount(parsed.accountId, activeAmount);
                        }
                    } catch (err) {
                        // QR биш бол өөр зүйл хийхгүй
                    }
                },
                (error) => {}
            ).catch(err => console.error(err));
        }

        async function chargeCustomerAccount(accountId, amount) {
            try {
                const querySnapshot = await db.collection("accounts")
                    .where("accountId", "==", accountId)
                    .get();

                if (querySnapshot.empty) {
                    fireToast(`❌ Account #${accountId} not found.`);
                    isProcessing = false;
                    return;
                }

                const customerDoc = querySnapshot.docs[0];
                const customerData = customerDoc.data();
                const currentBal = Number(customerData.balance) || 0;

                if (currentBal < amount) {
                    fireToast(`❌ Insufficient Funds! Balance: $${currentBal.toFixed(2)}`);
                    isProcessing = false;
                    return;
                }

                const newBalance = currentBal - amount;

                // 1. Данснаас нь мөнгийг хасна
                await customerDoc.ref.update({
                    balance: newBalance,
                    lastPurchase: new Date().toISOString()
                });

                // 2. POS системд Төлбөр амжилттай болсныг мэдээлнэ
                await db.collection("active_checkouts").doc("current_checkout").set({
                    status: "COMPLETED",
                    invoiceId: activeInvoiceId,
                    amount: amount,
                    customerName: customerData.name || accountId
                });

                fireToast(`🎉 Paid $${amount.toFixed(2)} from ${customerData.name}!`);
                setTimeout(() => { isProcessing = false; }, 2000);

            } catch (err) {
                fireToast("❌ Charge error: " + err.message);
                isProcessing = false;
            }
        }

        window.addEventListener('DOMContentLoaded', startScanner);
    </script>
</body>
</html>
