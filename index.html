<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POS System - Account Top Up</title>
  <style>
    :root {
      --primary: #007bff;
      --primary-hover: #0056b3;
      --bg: #1e293b;
      --card-bg: #ffffff;
      --text: #333333;
      --muted: #666666;
      --border: #cccccc;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 420px;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      color: var(--text);
      text-align: center;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.9rem;
    }

    input {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary);
    }

    .quick-amounts {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .chip {
      background: #e9ecef;
      border: 1px solid #ced4da;
      color: var(--text);
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .chip:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .account-preview {
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 6px;
      padding: 12px 15px;
      margin-bottom: 18px;
      display: none;
    }

    .account-preview .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }

    .account-preview .row:last-child {
      margin-bottom: 0;
    }

    .account-preview .val {
      font-weight: bold;
      color: var(--primary);
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button:disabled {
      background-color: #a0c4ff;
      cursor: not-allowed;
    }

    .status-msg {
      margin-top: 18px;
      padding: 12px;
      border-radius: 6px;
      font-weight: 500;
      display: none;
      text-align: center;
    }

    .status-msg.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status-msg.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
    }

    .back-link:hover {
      color: var(--text);
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Account Top-Up</h2>
    <form id="topUpForm">
      
      <div class="form-group">
        <label for="accountId">Account ID / Barcode</label>
        <input type="text" id="accountId" placeholder="e.g. 10011" required autocomplete="off" />
      </div>

      <!-- Live Account Preview Card -->
      <div class="account-preview" id="accountPreview">
        <div class="row">
          <span>Account Holder:</span>
          <span class="val" id="prevName">---</span>
        </div>
        <div class="row">
          <span>Current Balance:</span>
          <span class="val" id="prevBalance">$0.00</span>
        </div>
      </div>

      <div class="form-group">
        <label for="amount">Deposit Amount ($)</label>
        <div class="quick-amounts">
          <div class="chip" data-val="5">+$5</div>
          <div class="chip" data-val="10">+$10</div>
          <div class="chip" data-val="20">+$20</div>
          <div class="chip" data-val="50">+$50</div>
        </div>
        <input type="number" id="amount" step="0.01" placeholder="e.g. 25.00" required />
      </div>

      <button type="submit" id="submitBtn">Complete Electronic Deposit</button>
    </form>

    <div id="statusMsg" class="status-msg"></div>
    <a href="index.html" class="back-link">← Return to Staff POS Terminal</a>
  </div>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      query, 
      where, 
      getDocs, 
      getDoc,
      updateDoc, 
      doc, 
      increment,
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA03_nm4Zk3RXmgIxKbxXP-pEGWnzmsQOE",
      authDomain: "pos21-8f88f.firebaseapp.com",
      projectId: "pos21-8f88f",
      storageBucket: "pos21-8f88f.firebasestorage.app",
      messagingSenderId: "49870857272",
      appId: "1:49870857272:web:d349580c3d5ebb6f93f2cd"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById("topUpForm");
    const accountInput = document.getElementById("accountId");
    const amountInput = document.getElementById("amount");
    const submitBtn = document.getElementById("submitBtn");
    const statusMsg = document.getElementById("statusMsg");

    const previewBox = document.getElementById("accountPreview");
    const prevName = document.getElementById("prevName");
    const prevBalance = document.getElementById("prevBalance");

    function showMessage(text, isError = false) {
      statusMsg.innerText = text;
      statusMsg.className = `status-msg ${isError ? 'error' : 'success'}`;
      statusMsg.style.display = "block";
    }

    // Quick deposit amount chips listener
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        amountInput.value = parseFloat(chip.dataset.val).toFixed(2);
      });
    });

    // Helper: Find account document by field value OR document ID
    async function findAccountDocs(rawId) {
      const accountsRef = collection(db, "accounts");
      
      // Query 1: Search string match
      const qString = query(accountsRef, where("accountId", "==", rawId));
      let snapshot = await getDocs(qString);

      // Query 2: Search numeric match if rawId is a valid number
      if (snapshot.empty && !isNaN(rawId)) {
        const qNum = query(accountsRef, where("accountId", "==", Number(rawId)));
        snapshot = await getDocs(qNum);
      }

      // Query 3: Search by document ID directly (e.g. accounts/10011)
      if (snapshot.empty) {
        const directDocRef = doc(db, "accounts", rawId);
        const directDocSnap = await getDoc(directDocRef);
        if (directDocSnap.exists()) {
          return [{ id: directDocSnap.id, ref: directDocRef, data: directDocSnap.data() }];
        }
        return [];
      }

      return snapshot.docs.map(d => ({ id: d.id, ref: d.ref, data: d.data() }));
    }

    // Live Account Lookup
    let lookupTimeout = null;
    accountInput.addEventListener('input', () => {
      clearTimeout(lookupTimeout);
      const accountId = accountInput.value.trim();

      if (!accountId) {
        previewBox.style.display = "none";
        return;
      }

      lookupTimeout = setTimeout(async () => {
        try {
          const docs = await findAccountDocs(accountId);

          if (docs.length > 0) {
            const data = docs[0].data;
            prevName.innerText = data.name || data.customerName || `Account #${accountId}`;
            const bal = parseFloat(data.balance) || 0;
            prevBalance.innerText = `$${bal.toFixed(2)}`;
            previewBox.style.display = "block";
          } else {
            previewBox.style.display = "none";
          }
        } catch (err) {
          console.error("Lookup error:", err);
        }
      }, 300);
    });

    // Handle Top-Up Submit
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const accountId = accountInput.value.trim();
      const amount = parseFloat(amountInput.value);

      if (!accountId || isNaN(amount) || amount <= 0) {
        showMessage("Please enter a valid Account ID and Deposit Amount.", true);
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "Processing Deposit...";
      statusMsg.style.display = "none";

      try {
        const matchingDocs = await findAccountDocs(accountId);

        if (matchingDocs.length === 0) {
          showMessage(`Account ID "${accountId}" not found in Firestore!`, true);
          return;
        }

        // Update target document
        for (const targetDoc of matchingDocs) {
          const currentBal = parseFloat(targetDoc.data.balance) || 0;
          
          await updateDoc(targetDoc.ref, {
            balance: currentBal + amount,
            lastTopUp: new Date().toISOString(),
            updatedAt: serverTimestamp()
          });
        }

        showMessage(`✅ Deposited $${amount.toFixed(2)} to Account ${accountId}!`);
        form.reset();
        previewBox.style.display = "none";

      } catch (error) {
        console.error("Firestore update failed:", error);
        
        // Handle Firestore Security Rules errors
        if (error.code === 'permission-denied') {
          showMessage("Permission Denied: Ensure your Firestore database rules allow write access.", true);
        } else {
          showMessage("Failed to update Firestore: " + error.message, true);
        }
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Complete Electronic Deposit";
      }
    });
  </script>
</body>
</html>
