<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Merchant Register</title>
    <!-- Barcode/QR Scanning & Generation Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #3b82f6;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark-bg: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--dark-bg); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; padding: 20px; }

        .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 20px; }

        .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        .card-title { font-size: 1.2rem; font-weight: 700; color: white; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }

        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
        .input-field { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--card-border); background: #0f172a; color: white; font-size: 1rem; outline: none; }
        .input-field:focus { border-color: var(--primary); }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 14px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; transition: transform 0.1s; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: var(--warning); color: #000; }
        .btn-full { grid-column: span 2; }

        /* Dynamic QR Section */
        .qr-display-box { background: white; padding: 15px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-top: 15px; }
        #invoice-qr-code { margin: 10px 0; }

        .status-badge { padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; }
        .status-pending { background: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid var(--warning); }
        .status-paid { background: rgba(34, 197, 94, 0.2); color: var(--success); border: 1px solid var(--success); }

        /* Scanner Modal */
        .modal-backdrop { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; padding: 20px; }
        .modal-box { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; width: 100%; max-width: 380px; padding: 20px; text-align: center; }
        #reader { width: 100%; border-radius: 12px; overflow: hidden; background: black; }

        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #334155; color: white; padding: 12px 20px; border-radius: 30px; border: 1px solid #475569; font-weight: bold; display: none; z-index: 10000; text-align: center; width: 90%; max-width: 350px; }
    </style>
</head>
<body>

    <div class="app-container">

        <div class="card">
            <div class="card-title">
                <span>🛒 Merchant POS Register</span>
                <span id="payment-status-badge" class="status-badge status-pending" style="display:none;">Pending</span>
            </div>

            <!-- Sale Form -->
            <div class="input-group">
                <label>Sale Amount ($)</label>
                <input type="number" id="sale-amount" class="input-field" placeholder="0.00" step="0.01" min="0.01">
            </div>

            <div class="input-group">
                <label>Customer Account ID (Optional / Scanned)</label>
                <input type="text" id="customer-id-input" class="input-field" placeholder="Scan or enter Account ID">
            </div>

            <div class="btn-grid">
                <button class="btn btn-warning btn-full" onclick="openScannerModal()">
                    📷 SCAN CUSTOMER BARCODE / QR
                </button>
                <button class="btn btn-primary" onclick="generateInvoiceQR()">
                    ⚡ GENERATE INVOICE QR
                </button>
                <button class="btn btn-success" onclick="chargeDirectly()">
                    💳 DIRECT CHARGE
                </button>
            </div>

            <!-- Generated Invoice QR Box -->
            <div class="qr-display-box" id="qr-box" style="display: none;">
                <span style="color: #0f172a; font-weight: bold; font-size: 0.9rem;" id="qr-label">Scan to Pay</span>
                <div id="invoice-qr-code"></div>
                <span style="color: #64748b; font-size: 0.8rem;" id="invoice-id-display">Invoice #---</span>
            </div>
        </div>

    </div>

    <!-- CAMERA SCANNER MODAL -->
    <div class="modal-backdrop" id="scanner-modal">
        <div class="modal-box">
            <h3 style="margin-bottom: 12px;">Scan Customer Code</h3>
            <div id="reader"></div>
            <button class="btn btn-danger" onclick="closeScannerModal()" style="width: 100%; margin-top: 15px;">Close Camera</button>
        </div>
    </div>

    <div id="toast">Notification</div>

    <script>
        // Firebase Setup
        const firebaseConfig = {
            apiKey: "AIzaSyA03_nm4Zk3RXmgIxKbxXP-pEGWnzmsQOE",
            authDomain: "pos21-8f88f.firebaseapp.com",
            databaseURL: "https://pos21-8f88f-default-rtdb.firebaseio.com",
            projectId: "pos21-8f88f",
            storageBucket: "pos21-8f88f.firebasestorage.app",
            messagingSenderId: "49870857272",
            appId: "1:49870857272:web:d349580c3d5ebb6f93f2cd"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentInvoiceId = null;
        let html5QrcodeScanner = null;

        function generateInvoiceQR() {
            const amount = parseFloat(document.getElementById('sale-amount').value);
            if (isNaN(amount) || amount <= 0) {
                fireToast("❌ Enter a valid sale amount.");
                return;
            }

            currentInvoiceId = "INV-" + Math.floor(100000 + Math.random() * 900000);
            
            // Push Invoice to Cloud Database
            db.ref('invoices/' + currentInvoiceId).set({
                invoiceId: currentInvoiceId,
                amount: amount,
                status: 'pending',
                timestamp: Date.now()
            });

            // Listen live for payment on this specific invoice
            db.ref('invoices/' + currentInvoiceId).on('value', (snapshot) => {
                const data = snapshot.val();
                if (data && data.status === 'paid') {
                    markInvoicePaid(data.customerName || 'Customer', data.amount);
                }
            });

            const qrContainer = document.getElementById('invoice-qr-code');
            qrContainer.innerHTML = '';

            new QRCode(qrContainer, {
                text: JSON.stringify({
                    type: "POS_INVOICE",
                    invoiceId: currentInvoiceId,
                    amount: amount,
                    timestamp: Date.now()
                }),
                width: 180,
                height: 180,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            document.getElementById('invoice-id-display').innerText = `${currentInvoiceId} • $${amount.toFixed(2)}`;
            document.getElementById('qr-box').style.display = 'flex';
            
            const badge = document.getElementById('payment-status-badge');
            badge.innerText = 'Awaiting Payment';
            badge.className = 'status-badge status-pending';
            badge.style.display = 'inline-block';

            fireToast("⚡ Invoice QR created. Ready for customer to scan!");
        }

        /* DIRECT CHARGE (SCANNED CUSTOMER CODE) */
        async function chargeDirectly() {
            const accId = document.getElementById('customer-id-input').value.trim();
            const amount = parseFloat(document.getElementById('sale-amount').value);

            if (!accId || isNaN(amount) || amount <= 0) {
                fireToast("❌ Enter both sale amount and customer ID.");
                return;
            }

            const userRef = db.ref('accounts/' + accId);
            const snapshot = await userRef.once('value');
            const customer = snapshot.val();

            if (!customer) {
                fireToast("❌ Customer Account ID not found.");
                return;
            }

            const currentBalance = customer.balance || 0;

            if (currentBalance < amount) {
                fireToast(`❌ Insufficient balance ($${currentBalance.toFixed(2)}).`);
                return;
            }

            // Deduct funds in Firebase
            await userRef.update({
                balance: currentBalance - amount
            });

            // Log transaction in Firebase
            db.ref('transactions').push({
                senderId: customer.id,
                senderName: customer.name || 'Customer',
                recipientId: "POS_STORE",
                recipientName: "Merchant Store",
                amount: amount,
                timestamp: Date.now()
            });

            fireToast(`🎉 Successfully charged $${amount.toFixed(2)} to ${customer.name || accId}!`);
            document.getElementById('sale-amount').value = '';
            document.getElementById('customer-id-input').value = '';
        }

        function markInvoicePaid(customerName, amount) {
            const badge = document.getElementById('payment-status-badge');
            badge.innerText = 'Paid ✅';
            badge.className = 'status-badge status-paid';
            
            document.getElementById('qr-box').style.display = 'none';
            fireToast(`🎉 Received $${amount.toFixed(2)} payment from ${customerName}!`);
        }

        /* SCANNER LOGIC */
        function openScannerModal() {
            document.getElementById('scanner-modal').style.display = 'flex';
            html5QrcodeScanner = new Html5Qrcode("reader");
            html5QrcodeScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 220, height: 220 } },
                onScanSuccess,
                onScanFailure
            ).catch(err => {
                fireToast("❌ Camera access denied.");
                closeScannerModal();
            });
        }

        function closeScannerModal() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    html5QrcodeScanner.clear();
                    document.getElementById('scanner-modal').style.display = 'none';
                }).catch(() => {
                    document.getElementById('scanner-modal').style.display = 'none';
                });
            } else {
                document.getElementById('scanner-modal').style.display = 'none';
            }
        }

        function onScanSuccess(decodedText) {
            closeScannerModal();
            try {
                const parsed = JSON.parse(decodedText);
                if (parsed.type === "CUSTOMER_WALLET_PAY") {
                    document.getElementById('customer-id-input').value = parsed.accountId;
                    fireToast(`Scanned Customer: ${parsed.name} (${parsed.accountId})`);
                    return;
                }
            } catch(e) {}

            document.getElementById('customer-id-input').value = decodedText;
            fireToast(`Scanned ID: ${decodedText}`);
        }

        function onScanFailure(error) {}

        function fireToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3500);
        }
    </script>
</body>
</html>
