<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Merchant Register</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyA03_nm4Zk3RXmgIxKbxXP-pEGWnzmsQOE",
        authDomain: "pos21-8f88f.firebaseapp.com",
        databaseURL: "https://pos21-8f88f-default-rtdb.firebaseio.com",
        projectId: "pos21-8f88f",
        storageBucket: "pos21-8f88f.firebasestorage.app",
        messagingSenderId: "49870857272",
        appId: "1:49870857272:web:d349580c3d5ebb6f93f2cd"
      };

      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      const db = firebase.firestore();
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold text-blue-500 flex items-center gap-2">
            🛒 POS Merchant Terminal
        </h1>
        <div class="flex items-center gap-3">
            <a href="pos_scan.html" target="_blank" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded-lg text-sm transition shadow">
                📷 Open Dedicated Scanner
            </a>
        </div>
    </header>

    <!-- Main POS Grid -->
    <div class="flex-1 grid grid-cols-1 md:grid-cols-3 gap-6 p-6 max-w-7xl mx-auto w-full">

        <!-- Left: Product Catalog -->
        <div class="md:col-span-2 bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-xl flex flex-col">
            <h2 class="text-lg font-bold mb-4 text-slate-300">Select Items</h2>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 overflow-y-auto max-h-[650px] p-1">
                <!-- Sample Products -->
                <button onclick="addToCart('Coffee', 4.50)" class="bg-slate-700 hover:bg-slate-600 border border-slate-600 p-4 rounded-xl flex flex-col items-center justify-center gap-2 transition active:scale-95 shadow">
                    <span class="text-3xl">☕</span>
                    <span class="font-bold">Coffee</span>
                    <span class="text-emerald-400 font-extrabold">$4.50</span>
                </button>
                <button onclick="addToCart('Sandwich', 7.00)" class="bg-slate-700 hover:bg-slate-600 border border-slate-600 p-4 rounded-xl flex flex-col items-center justify-center gap-2 transition active:scale-95 shadow">
                    <span class="text-3xl">🥪</span>
                    <span class="font-bold">Sandwich</span>
                    <span class="text-emerald-400 font-extrabold">$7.00</span>
                </button>
                <button onclick="addToCart('Juice', 3.50)" class="bg-slate-700 hover:bg-slate-600 border border-slate-600 p-4 rounded-xl flex flex-col items-center justify-center gap-2 transition active:scale-95 shadow">
                    <span class="text-3xl">🧃</span>
                    <span class="font-bold">Juice</span>
                    <span class="text-emerald-400 font-extrabold">$3.50</span>
                </button>
                <button onclick="addToCart('Burger', 9.50)" class="bg-slate-700 hover:bg-slate-600 border border-slate-600 p-4 rounded-xl flex flex-col items-center justify-center gap-2 transition active:scale-95 shadow">
                    <span class="text-3xl">🍔</span>
                    <span class="font-bold">Burger</span>
                    <span class="text-emerald-400 font-extrabold">$9.50</span>
                </button>
                <button onclick="addToCart('Pizza Slice', 5.00)" class="bg-slate-700 hover:bg-slate-600 border border-slate-600 p-4 rounded-xl flex flex-col items-center justify-center gap-2 transition active:scale-95 shadow">
                    <span class="text-3xl">🍕</span>
                    <span class="font-bold">Pizza Slice</span>
                    <span class="text-emerald-400 font-extrabold">$5.00</span>
                </button>
                <button onclick="addToCart('Donut', 2.50)" class="bg-slate-700 hover:bg-slate-600 border border-slate-600 p-4 rounded-xl flex flex-col items-center justify-center gap-2 transition active:scale-95 shadow">
                    <span class="text-3xl">🍩</span>
                    <span class="font-bold">Donut</span>
                    <span class="text-emerald-400 font-extrabold">$2.50</span>
                </button>
            </div>
        </div>

        <!-- Right: Order Summary Cart -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-xl flex flex-col justify-between">
            <div>
                <h2 class="text-lg font-bold mb-4 text-slate-300">Current Order</h2>
                <div id="cart-list" class="flex flex-col gap-3 max-h-[400px] overflow-y-auto mb-4 divide-y divide-slate-700">
                    <div class="text-slate-500 text-center py-8">Cart is empty</div>
                </div>
            </div>

            <div class="border-t border-slate-700 pt-4 flex flex-col gap-4">
                <div class="flex justify-between items-center text-xl font-extrabold">
                    <span>Total Due:</span>
                    <span id="cart-total" class="text-blue-400">$0.00</span>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="clearCart()" class="bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 rounded-xl transition active:scale-95 shadow">
                        Clear
                    </button>
                    <button onclick="openCheckoutModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition active:scale-95 shadow">
                        Checkout
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- ================= CHECKOUT / SCANNING MODAL ================= -->
    <div id="checkout-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-3xl max-w-md w-full p-6 text-center shadow-2xl relative">
            
            <button onclick="closeCheckoutModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl">✕</button>

            <!-- 1. ТӨЛБӨР ХҮЛЭЭЖ БАЙГАА ЦОНХ -->
            <div id="modal-waiting-view">
                <h3 class="text-lg font-bold text-slate-300 mb-1">SCAN CUSTOMER QR</h3>
                <p class="text-xs text-slate-400 mb-4">Point customer wallet or camera scanner to pay</p>

                <div class="text-4xl font-black text-blue-400 my-4" id="modal-total-display">$0.00</div>

                <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 mb-6 flex flex-col items-center justify-center gap-3">
                    <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                    <span class="text-sm font-semibold text-slate-300">Waiting for transaction...</span>
                </div>
            </div>

            <!-- 2. 🎉 ТӨЛБӨР АМЖИЛТТАЙ БОЛСОН ҮЕД ХАРАГДАХ НОГООН ЦОНХ -->
            <div id="modal-success-view" class="hidden flex-col items-center justify-center py-6">
                <div class="w-24 h-24 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center text-5xl mb-4 border-2 border-emerald-500 animate-bounce shadow-lg shadow-emerald-500/20">
                    ✓
                </div>
                <h3 class="text-2xl font-black text-emerald-400 mb-2">PAYMENT SUCCESSFUL!</h3>
                <p class="text-slate-300 font-semibold mb-1" id="success-customer-name">Customer</p>
                <div class="text-3xl font-extrabold text-white mb-6" id="success-amount-display">$0.00</div>

                <button onclick="closeCheckoutModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-8 rounded-xl w-full shadow transition">
                    Done / Next Order
                </button>
            </div>

        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-700 text-white font-bold px-6 py-3 rounded-full border border-slate-600 shadow-xl hidden z-50">
        Notification
    </div>

    <script>
        let cart = [];
        let totalDue = 0.00;
        let activeInvoiceId = null;
        let transactionUnsubscribe = null;
        const displayChannel = new BroadcastChannel('pos_system_channel');

        function fireToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => { toast.classList.add('hidden'); }, 3000);
        }

        function playBeepSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = "sine";
                oscillator.frequency.setValueAtTime(850, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15);
            } catch (e) {}
        }

        function addToCart(name, price) {
            const existing = cart.find(item => item.name === name);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ name, price, qty: 1 });
            }
            renderCartUI();
        }

        function renderCartUI() {
            const cartContainer = document.getElementById('cart-list');
            cartContainer.innerHTML = '';
            totalDue = 0.00;

            if (cart.length === 0) {
                cartContainer.innerHTML = '<div class="text-slate-500 text-center py-8">Cart is empty</div>';
                document.getElementById('cart-total').innerText = '$0.00';
                return;
            }

            cart.forEach((item, index) => {
                const itemTotal = item.price * item.qty;
                totalDue += itemTotal;

                const row = document.createElement('div');
                row.className = 'flex justify-between items-center py-2';
                row.innerHTML = `
                    <div>
                        <div class="font-bold">${item.name}</div>
                        <div class="text-xs text-slate-400">$${item.price.toFixed(2)} x ${item.qty}</div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-bold text-emerald-400">$${itemTotal.toFixed(2)}</span>
                        <button onclick="removeFromCart(${index})" class="text-rose-400 hover:text-rose-300 font-bold px-1">✕</button>
                    </div>
                `;
                cartContainer.appendChild(row);
            });

            document.getElementById('cart-total').innerText = `$${totalDue.toFixed(2)}`;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCartUI();
        }

        function clearCart() {
            cart = [];
            renderCartUI();
        }

        function openCheckoutModal() {
            if (cart.length === 0) {
                fireToast("❌ Cart is empty.");
                return;
            }

            activeInvoiceId = "INV_" + Date.now();
            document.getElementById('modal-total-display').innerText = `$${totalDue.toFixed(2)}`;
            
            // Цонхыг нээх & Төлөвийг хүлээх горимд оруулах
            document.getElementById('modal-waiting-view').classList.remove('hidden');
            document.getElementById('modal-success-view').classList.add('hidden');
            document.getElementById('modal-success-view').classList.remove('flex');
            document.getElementById('checkout-modal').classList.remove('hidden');
            document.getElementById('checkout-modal').classList.add('flex');

            // 1. Firestore руу checkout бичих
            db.collection("active_checkouts").doc("current_checkout").set({
                status: "PENDING",
                invoiceId: activeInvoiceId,
                amount: totalDue,
                createdAt: Date.now()
            });

            // 2. Гүйлгээ амжилттай (COMPLETED) болохыг чагнаж Ногоон зөв тэмдэг гаргах
            if (transactionUnsubscribe) transactionUnsubscribe();

            transactionUnsubscribe = db.collection("active_checkouts").doc("current_checkout")
                .onSnapshot((docSnap) => {
                    if (docSnap.exists) {
                        const data = docSnap.data();
                        if (data.status === "COMPLETED" && data.invoiceId === activeInvoiceId) {
                            showSuccessUI(data.customerName || "Customer", data.amount);
                        }
                    }
                });

            displayChannel.postMessage({
                type: 'SHOW_INVOICE_QR',
                invoiceId: activeInvoiceId,
                amount: totalDue,
                cart: cart
            });
        }

        // 🎉 АМЖИЛТТАЙ ЗӨВ ТЭМДЭГ ХАРУУЛАХ ФУНКЦ
        function showSuccessUI(customerName, amount) {
            playBeepSound();
            document.getElementById('modal-waiting-view').classList.add('hidden');
            document.getElementById('modal-success-view').classList.remove('hidden');
            document.getElementById('modal-success-view').classList.add('flex');

            document.getElementById('success-customer-name').innerText = `Paid by: ${customerName}`;
            document.getElementById('success-amount-display').innerText = `$${Number(amount).toFixed(2)}`;

            clearCart();
        }

        function closeCheckoutModal() {
            document.getElementById('checkout-modal').classList.add('hidden');
            document.getElementById('checkout-modal').classList.remove('flex');

            if (transactionUnsubscribe) transactionUnsubscribe();

            db.collection("active_checkouts").doc("current_checkout").set({
                status: "IDLE",
                invoiceId: null,
                amount: 0.00
            });
        }
    </script>
</body>
</html>
